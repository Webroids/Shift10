    {"@type":"Question","name":"Für wen ist der Workshop?","acceptedAnswer":{"@type":"Answer","text":"Für Teams, die KI im eigenen Betrieb einsetzen oder professioneller damit umgehen wollen — vom konkreten Anwendungsfall bis hin zu Vorgehen und Strategie für die IT."}},

    {"@type":"Question","name":"Wie schnell könnt ihr bei uns vorbeikommen?","acceptedAnswer":{"@type":"Answer","text":"Schreib uns oder ruf an. Erstgespräche, Vorträge und Workshops sind je nach Kalender kurzfristig möglich."}},
    {"@type":"Question","name":"Helft ihr uns, die richtigen KI-Anwendungsfälle zu finden?","acceptedAnswer":{"@type":"Answer","text":"Ja. Gemeinsam mit euch sammeln wir mögliche Einsatzgebiete und priorisieren sie nach Nutzen und Aufwand."}},
    {"@type":"Question","name":"Es gibt unzählige KI-Tools — welches ist das richtige für uns?","acceptedAnswer":{"@type":"Answer","text":"Genau dabei helfen wir. Wir vergleichen die in Frage kommenden Tools für euren konkreten Bedarf. Weil wir an keinem Tool mitverdienen, ist die Empfehlung unabhängig."}},
    {"@type":"Question","name":"Warum benötigt es KI-Verhaltensrichtlinien für unsere Mitarbeitende?","acceptedAnswer":{"@type":"Answer","text":"Weil eure Leute KI ohnehin schon nutzen — meist ohne zu wissen, welche Daten sie eingeben dürfen. Klare Richtlinien verhindern, dass Kundendaten oder Geschäftsgeheimnisse im falschen Tool landen."}},
    {"@type":"Question","name":"Was ist eine KI-Unternehmensanalyse?","acceptedAnswer":{"@type":"Answer","text":"Eine strukturierte Standortbestimmung: Wo steht euer Betrieb bei KI, was nutzt ihr bereits, wo liegen Chancen und Risiken? Das Ergebnis ist die Grundlage für sinnvolle nächste Schritte."}},
    {"@type":"Question","name":"Warum benötigen wir eine KI-Strategie?","acceptedAnswer":{"@type":"Answer","text":"Damit KI dort eingesetzt wird, wo sie eurem Betrieb wirklich nützt. Eine Strategie verbindet eure Geschäftsziele mit der IT und legt fest, welche Schritte in welcher Reihenfolge Sinn machen."}}

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroVariant": "orbit",
  "showDotgrid": true,
  "accent": "#FF4D00"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply accent color globally
  React.useEffect(() => {
    document.documentElement.style.setProperty('--color-accent', t.accent);
  }, [t.accent]);

  // Hide dotgrids if toggled off
  React.useEffect(() => {
    document.querySelectorAll('.dotgrid').forEach(el => {
      el.style.display = t.showDotgrid ? '' : 'none';
    });
  });

  // Hero is dark only when matrix variant
  const navDark = false; // header is light, sticky-translucent

  return (
    <>
      <Nav dark={navDark} />
      <main>
        <div id="hero">
          <Hero variant={t.heroVariant} />
        </div>
        <AuthoritySection />
        <VideoSection />
        <ProblemSection />

        <ProcessSection />
        <MikeSection />
        <SocialProofSection />
        <PreiseSection />
        <WasMachenWirNichtSection />
        <KontaktSection />
        <FAQSection />
      </main>
      <FooterSection />

      <TweaksPanel>
        <TweakSection label="Hero" />
        <TweakRadio
          label="Variant"
          value={t.heroVariant}
          options={[
            { value: "type", label: "Type" },
            { value: "terminal", label: "Terminal" },
            { value: "matrix", label: "Matrix" },
            { value: "orbit", label: "Orbit" },
          ]}
          onChange={(v) => setTweak('heroVariant', v)}
        />
        <TweakSection label="Style" />
        <TweakColor
          label="Accent"
          value={t.accent}
          options={["#FF4D00", "#000000", "#0066FF", "#1F8A5B"]}
          onChange={(v) => setTweak('accent', v)}
        />
        <TweakToggle
          label="Dot grid texture"
          value={t.showDotgrid}
          onChange={(v) => setTweak('showDotgrid', v)}
        />
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
